[package]
name = "wow-font-d3d9"
version = "0.2.0"
edition = "2024"
description = "Vector text for WoW 3.3.5a: a proxy d3d9.dll that draws the game's text from font outlines"
license = "GPL-3.0-or-later"
authors = ["mightsleep <acannix@proton.me>"]
repository = "https://github.com/mightsleep/wow-font-d3d9"
publish = false
# tests/ is a crate of its own, built for the host (this one is a Windows DLL).
autotests = false

[lib]
name = "d3d9"
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
opt-level = 2
strip = true

[dependencies]
ttf-parser = "0.25.1"
adler2 = { version = "2.0.1", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

# `nix flake check` runs clippy with -D warnings. Allowed: the Win32 names
# (HRESULT) and exports Windows calls, not Rust (no `# Safety` reader);
# vtable and tuple types spelled where they are used; index loops over
# texels and words, which read as the maths they are.
[lints.clippy]
upper_case_acronyms = "allow"
missing_safety_doc = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
