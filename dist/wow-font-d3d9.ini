# wow-font-d3d9: read again whenever this file changes (the game keeps running).
# alpha = coverage^(1/gamma)
gamma = 1.5
# pixels added to the client's outline radius
outline = 0.25
# 0: the client's bitmaps for every font, as without the proxy
v2 = 1
# 0: magnified text reads the bands; 2: the words' path in colour
words = 1
