# Everything is in the flake: the DLL, the host tests, the shader bytecode
# against its HLSL, the DLL's imports and exports, the release zip.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
