# A tag vX.Y.Z (the version in Cargo.toml) makes a release: d3d9.dll on its
# own for players, the zip from `nix build .#release` (the DLL, a sample
# ini, README, LICENSE) built twice to be sure it is reproducible, and the
# SHA-256 of both, with a provenance attestation for the DLL and the zip.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: The tag is the crate's version
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $want"; exit 1; }
      - run: nix flake check -L
      - name: Build, twice
        run: |
          nix build -L .#release
          nix build -L .#release --rebuild
          d="wow-font-d3d9-${GITHUB_REF_NAME#v}"
          cp -L result "$d.zip"
          nix build -L .#default -o dll
          cp -L dll/d3d9.dll d3d9.dll
          # The DLL also under its path in the zip: unpacked next to
          # SHA256SUMS, sha256sum -c checks all three.
          mkdir -p "$d" && cp d3d9.dll "$d/d3d9.dll"
          sha256sum d3d9.dll "$d.zip" "$d/d3d9.dll" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            d3d9.dll
            wow-font-d3d9-*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="wow-font-d3d9-${GITHUB_REF_NAME#v}"
          dll=$(sha256sum d3d9.dll | cut -d' ' -f1)
          zip=$(sha256sum "$d.zip" | cut -d' ' -f1)
          cat > notes.md <<NOTES
          ## Install

          1. Download \`d3d9.dll\` and put it next to \`Wow.exe\` (WoW 3.3.5a, build 12340).
          2. If a \`d3d9.dll\` is there already (DXVK, ReShade), rename it and point
             \`WOW_FONT_D3D9_REAL\` at it; see the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#install).
          3. Under Wine: \`WINEDLLOVERRIDES="d3d9=n,b" wine Wow.exe\`.

          To uninstall, delete \`d3d9.dll\`. The zip holds the same DLL with a sample
          \`wow-font-d3d9.ini\`, the README and the license.

          ## Verify

          SHA-256: \`d3d9.dll\` ${dll}, the zip ${zip} (all in \`SHA256SUMS\`).
          The build is reproducible: \`nix build github:${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}#release\`
          gives the same zip.
          GitHub attests both were built here from this tag:
          \`gh attestation verify d3d9.dll -R ${GITHUB_REPOSITORY}\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" d3d9.dll "$d.zip" SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md
